name: "🐛 Bug Report"
description: "Report a bug, calculation error, notification issue, or crash in Safe Bloom"
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thank you for helping improve Safe Bloom! 🌸
        Safe Bloom is an offline-first, zero-knowledge cycle tracker. Please ensure your report does not contain sensitive personal health information (e.g. personal notes).

  - type: dropdown
    id: app-mode
    attributes:
      label: App Tracking Mode
      description: What tracking mode were you in when this issue occurred?
      options:
        - "Track Cycle (Default)"
        - "Trying to Conceive (TTC)"
        - "Track Pregnancy"
        - "Initial Setup / Onboarding"
    validations:
      required: true

  - type: dropdown
    id: subsystem
    attributes:
      label: Affected Subsystem
      description: Which part of the application is behaving unexpectedly?
      options:
        - "Cycle Predictions & Period Calculations"
        - "Calendar & Flow/Spotting Logging"
        - "Notifications & System Reminders"
        - "Encrypted Backup & Vault Restore"
        - "Biometric Lock & Screen Security"
        - "PDF Medical Report Generation"
        - "Educational Articles & Insights"
        - "Database / Startup / Other"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Safe Bloom Version
      description: What version of the app are you running? (e.g., v1.0.0 or git commit)
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: input
    id: device-os
    attributes:
      label: Device & Operating System
      description: Device model and OS version (e.g., Google Pixel 8 - Android 14, iPhone 15 - iOS 17.5, Windows 11)
      placeholder: "e.g., Samsung Galaxy S23, Android 14"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: "Explain what went wrong..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue step by step?
      value: |
        1. Open the app and navigate to '...'
        2. Tap on '...'
        3. Observe that '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: "Describe the expected behavior..."
    validations:
      required: true

  - type: textarea
    id: logs-screenshots
    attributes:
      label: Screenshots / Stack Trace / Logs
      description: Add any sanitized screenshots, Flutter error logs, or relevant details. (⚠️ DO NOT share screenshots containing private personal notes or sensitive cycle history).
      placeholder: "Paste relevant sanitized stack trace or error log here..."
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Privacy & Bug Confirmation
      options:
        - label: "I have verified that this report does NOT contain sensitive personal health data."
          required: true
        - label: "I have checked existing issues to ensure this is not a duplicate."
          required: true
